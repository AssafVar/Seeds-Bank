name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    name: Client (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --coverage

  server:
    name: Server (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Local-only credentials from docker-compose.yml; no secrets involved.
      - name: Start Postgres
        working-directory: .
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U seeds_bank -d seeds_bank; then exit 0; fi
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - name: Test
        env:
          TEST_POSTGRES: Host=localhost;Port=5433;Database=seeds_bank;Username=seeds_bank;Password=seeds_bank_dev
        run: dotnet test Server.slnx

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t seeds-bank .
