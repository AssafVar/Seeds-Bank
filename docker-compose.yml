# Local development services. Credentials here (and in dev/seaweedfs-s3.json) are for local use only.
# Host ports are offset from manageit's so both stacks can run at once; every port is bound to 127.0.0.1.
# Start: docker compose up -d     Stop: docker compose down     Wipe data: docker compose down -v
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seeds_bank
      POSTGRES_USER: seeds_bank
      POSTGRES_PASSWORD: seeds_bank_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeds_bank"]
      interval: 5s
      retries: 10

  # S3-compatible storage, standing in for Cloudflare R2 locally.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:9100:8333"
    volumes:
      - storage-data:/data
      - ./dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # Catches every email the API sends locally (nothing leaves your machine). Inbox: http://localhost:8026
  mail:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

volumes:
  postgres-data:
  storage-data:
